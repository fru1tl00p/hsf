<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNB Nowcast Hp30 Visualizer</title>
    <!-- Highcharts CDN -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/offline-exporting.js"></script>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: monospace, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        button {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #333;
        }
        #container {
            width: 100%;
            height: 450px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        .footer {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Nowcast Hs30 index — CNB (Canberra)</h2>
            <small style="color: #888;">GFZ Helmholtz Centre for Geosciences</small>
        </div>
        <div>
            <button onclick="loadData()">Fetch Local Archive</button>
        </div>
    </div>

    <div id="container"></div>

    <div class="footer">
        <span>Thresholds: &lt;4 (Green) | 4 to &lt;6 (Yellow) | &ge;6 (Red)</span>
        <span id="status">Status: Ready</span>
    </div>

    <script>
        async function loadData() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Status: Loading data/latest.json...";

            try {
                const response = await fetch('./data/latest.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const rawData = await response.json();
                parseAndRender(rawData);
                statusEl.textContent = `Status: Successfully loaded at ${new Date().toUTCString()}`;
            } catch (error) {
                console.error(error);
                statusEl.textContent = `Status: Error loading data — ${error.message}`;
            }
        }

        function parseAndRender(rawData) {
            // Find a key matching CNB (e.g., CNB_MEDIAN, CNB_MAX, or just CNB)
            const keys = Object.keys(rawData);
            let targetKey = keys.find(k => k.toUpperCase().startsWith('CNB_') || k.toUpperCase() === 'CNB');
            
            if (!targetKey && keys.length > 0) {
                // Fallback to first available key if CNB isn't explicitly prefixed
                targetKey = keys.find(k => k.toUpperCase().includes('CNB')) || keys[0];
            }

            if (!targetKey || !rawData[targetKey]) {
                throw new Error("Could not find a valid CNB data series key in the JSON payload.");
            }

            const timeMap = rawData[targetKey];
            if (typeof timeMap !== 'object' || timeMap === null) {
                throw new Error(`Data structure for key '${targetKey}' is not a valid timestamp dictionary.`);
            }

            // Sort timestamps chronologically
            const sortedTimestamps = Object.keys(timeMap).sort();

            let categories = [];
            let seriesData = [];

            sortedTimestamps.forEach(t => {
                let v = timeMap[t];
                if (v !== null && v !== undefined) {
                    // Format time label to UTC HH:mm
                    let timeStr = t.slice(11, 16) + ' UTC';
                    categories.push(timeStr);
                    
                    let val = parseFloat(v);
                    let color = '#22c55e'; // Green < 4
                    if (val >= 6) color = '#ef4444'; // Red >= 6
                    else if (val >= 4) color = '#eab308'; // Yellow 4-<6

                    seriesData.push({
                        y: val,
                        color: color
                    });
                }
            });

            renderHighchart(categories, seriesData, targetKey);
        }

        function renderHighchart(categories, data, seriesName) {
            Highcharts.chart('container', {
                chart: {
                    type: 'column',
                    backgroundColor: '#1a1a1a',
                    style: { fontFamily: 'monospace' }
                },
                title: { 
                    text: `Series: ${seriesName}`, 
                    style: { color: '#888', fontSize: '12px' },
                    align: 'left'
                },
                credits: { enabled: false },
                xAxis: {
                    categories: categories,
                    labels: { style: { color: '#888' } },
                    lineColor: '#333',
                    tickColor: '#333'
                },
                yAxis: {
                    min: 0,
                    max: 9,
                    tickInterval: 1,
                    title: { text: 'Hs30 Index', style: { color: '#888' } },
                    gridLineColor: '#262626',
                    labels: { style: { color: '#888' } }
                },
                legend: { enabled: false },
                plotOptions: {
                    column: {
                        pointPadding: 0.05,
                        groupPadding: 0.05,
                        borderWidth: 0
                    }
                },
                tooltip: {
                    headerFormat: '<b>{point.key}</b><br/>',
                    pointFormat: 'Value: <b>{point.y}</b>'
                },
                series: [{
                    name: seriesName,
                    data: data
                }]
            });
        }

        // Auto-load on page open
        loadData();
    </script>
</body>
</html>
