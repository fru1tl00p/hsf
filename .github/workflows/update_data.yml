name: Fetch GFZ Hs30 Data Daily

on:
  schedule:
    - cron: '5 0 * * *' # Runs every day at 00:05 UTC (just after midnight)
  workflow_dispatch:      # Allows you to manually trigger it anytime from the GitHub website!

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the action can commit the files back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Save Data
        run: |
          python -c "
          import urllib.request
          import json
          import os
          from datetime import datetime, timezone

          url = 'https://isdc-data.gfz.de/geomagnetism/HpoForecast/v0102/output/Hs/json/forecast_mean_bars_Hs30.json'
          
          print('Downloading GFZ data...')
          req = urllib.request.Request(
              url, 
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          )
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode('utf-8'))

          # Create directories if they don't exist
          os.makedirs('data/archive', exist_ok=True)

          # Save latest.json
          with open('data/latest.json', 'w') as f:
              json.dump(data, f, indent=2)

          # Save daily archive file using current UTC date (e.g., 2026-10-21.json)
          today_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          archive_path = f'data/archive/{today_str}.json'
          with open(archive_path, 'w') as f:
              json.dump(data, f, indent=2)
              
          print(f'Successfully saved latest.json and archive for {today_str}')
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GFZ data and archive [skip ci]" && git push)
