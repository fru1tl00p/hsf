<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNB Hs30 Visualizer</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-6 flex flex-col gap-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Nowcast Hs30 Index</h1>
                <p class="text-xs text-slate-400 mt-1">GFZ Helmholtz Centre — Station: <span class="text-sky-400 font-semibold">CNB (Canberra)</span></p>
            </div>
            
            <!-- Controls -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button id="fetch-btn" onclick="fetchLiveData()" class="flex-1 md:flex-none bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors cursor-pointer shadow-md">
                    Fetch Live Data
                </button>
                <button id="export-btn" onclick="exportChartAsPNG()" disabled class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 font-medium text-sm px-4 py-2 rounded-lg transition-colors cursor-pointer border border-slate-700">
                    Export PNG
                </button>
            </div>
        </div>

        <!-- Status / Error Banner -->
        <div id="status-banner" class="hidden p-4 rounded-lg text-sm font-medium"></div>

        <!-- Chart Container -->
        <div class="relative w-full h-[400px] bg-white rounded-lg p-4 shadow-inner">
            <canvas id="hpChart"></canvas>
        </div>

        <!-- Footer Info -->
        <div class="text-xs text-slate-500 flex justify-between items-center pt-2 border-t border-slate-800/60">
            <span>Thresholds: <span class="text-green-500 font-bold">&lt;4</span> (Green) | <span class="text-yellow-400 font-bold">4 to &lt;6</span> (Yellow) | <span class="text-red-500 font-bold">≥6</span> (Red)</span>
            <span id="last-updated">Status: Ready for manual fetch</span>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        let chartInstance = null;

        function showStatus(message, type = 'info') {
            const banner = document.getElementById('status-banner');
            banner.classList.remove('hidden', 'bg-red-950/80', 'text-red-200', 'border', 'border-red-800', 'bg-sky-950/80', 'text-sky-200', 'border-sky-800');
            
            if (type === 'error') {
                banner.classList.add('bg-red-950/80', 'text-red-200', 'border', 'border-red-800');
            } else {
                banner.classList.add('bg-sky-950/80', 'text-sky-200', 'border', 'border-sky-800');
            }
            banner.textContent = message;
        }

        function hideStatus() {
            const banner = document.getElementById('status-banner');
            banner.classList.add('hidden');
        }

        async function fetchLiveData() {
            const btn = document.getElementById('fetch-btn');
            const exportBtn = document.getElementById('export-btn');
            btn.disabled = true;
            btn.textContent = "Fetching...";
            showStatus("Fetching forecast_mean_bars_Hs30.json via proxy...", "info");

            try {
                // Target exact JSON file shown in the ISDC directory listing
                const targetUrl = 'https://isdc-data.gfz.de/geomagnetism/HpoForecast/v0102/output/Hs/json/forecast_mean_bars_Hs30.json';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const proxyData = await response.json();
                if (!proxyData.contents) {
                    throw new Error("Invalid response received from proxy wrapper.");
                }

                const data = JSON.parse(proxyData.contents);
                parseAndRenderData(data);
                
                hideStatus();
                exportBtn.disabled = false;
                document.getElementById('last-updated').textContent = `Last fetched: ${new Date().toUTCString()}`;
            } catch (error) {
                console.error("Fetch failed:", error);
                showStatus(`Failed to fetch live data: ${error.message}.`, "error");
                document.getElementById('last-updated').textContent = "Status: Fetch failed";
            } finally {
                btn.disabled = false;
                btn.textContent = "Fetch Live Data";
            }
        }

        function parseAndRenderData(rawData) {
            let labels = [];
            let values = [];

            // Locate station CNB (Canberra) within the parsed JSON payload structure
            let records = null;
            if (Array.isArray(rawData)) {
                const cnbObj = rawData.find(item => 
                    (item.station && item.station.toUpperCase() === "CNB") || 
                    (item.id && item.id.toUpperCase() === "CNB") ||
                    (item.name && item.name.toUpperCase() === "CNB")
                );
                records = cnbObj ? (cnbObj.data || cnbObj.values || cnbObj.time_series) : rawData;
            } else if (rawData.stations) {
                const key = Object.keys(rawData.stations).find(k => k.toUpperCase() === "CNB");
                records = key ? rawData.stations[key] : null;
            } else if (rawData.CNB) {
                records = rawData.CNB;
            } else {
                records = rawData.data || rawData.values || rawData;
            }

            if (!Array.isArray(records)) {
                // If the file format stores stations as keys or objects, let's inspect keys
                if (typeof rawData === 'object' && rawData !== null) {
                    const cnbKey = Object.keys(rawData).find(k => k.toUpperCase() === "CNB");
                    if (cnbKey) records = rawData[cnbKey];
                }
            }

            if (!Array.isArray(records)) {
                throw new Error("Could not locate valid time-series array for station CNB in forecast_mean_bars_Hs30.json.");
            }

            records.forEach(entry => {
                let t = entry.time || entry.timestamp || entry.epoch || (Array.isArray(entry) ? entry[0] : null);
                let v = entry.hs30 !== undefined ? entry.hs30 : (entry.hp30 !== undefined ? entry.hp30 : (entry.value !== undefined ? entry.value : (Array.isArray(entry) ? entry[1] : null)));
                
                if (t && v !== null && v !== undefined) {
                    labels.push(new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC');
                    values.push(parseFloat(v));
                }
            });

            if (labels.length === 0) {
                throw new Error("Parsed records array for CNB contained no valid time/value elements.");
            }

            renderChart(labels, values);
        }

        function renderChart(labels, values) {
            const ctx = document.getElementById('hpChart').getContext('2d');
            
            // Color coding convention: <4 Green, 4-<6 Yellow, >=6 Red
            const barColors = values.map(val => {
                if (val >= 6) return '#ef4444'; // Red
                if (val >= 4) return '#eab308'; // Yellow
                return '#22c55e'; // Green
            });

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'CNB Hs30 Index',
                        data: values,
                        backgroundColor: barColors,
                        borderWidth: 0,
                        barPercentage: 0.9,
                        categoryPercentage: 0.9
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 9,
                            ticks: {
                                stepSize: 1,
                                color: '#475569'
                            },
                            grid: {
                                color: '#e2e8f0'
                            },
                            title: {
                                display: true,
                                text: 'Hs30 Index',
                                color: '#1e293b',
                                font: { weight: 'bold' }
                            }
                        },
                        x: {
                            ticks: {
                                color: '#475569',
                                maxRotation: 45,
                                minRotation: 0
                            },
                            grid: {
                                display: false
                            },
                            title: {
                                display: true,
                                text: 'Time (UTC)',
                                color: '#1e293b',
                                font: { weight: 'bold' }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `CNB Hs30: ${context.parsed.y}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function exportChartAsPNG() {
            if (!chartInstance) return;
            const imageURL = chartInstance.toBase64Image();
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = `CNB_Hs30_${new Date().toISOString().slice(0,10)}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
